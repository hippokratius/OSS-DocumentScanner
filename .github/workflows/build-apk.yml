name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Yarn 4 ships via Corepack; no separate install needed
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: yarn install --immutable

      # Install the NativeScript CLI globally so the `ns` command is in PATH.
      # @akylas/nativescript is a fork of the NativeScript CLI; its binary is not
      # linked into node_modules/.bin due to the workspace hoisting configuration.
      - name: Install NativeScript CLI globally
        run: npm install -g @akylas/nativescript@8.9.15

      - name: Build debug APK
        run: ns build android --env.adhoc

      - name: Prepare release metadata
        id: meta
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA="${GITHUB_SHA::7}"
          APK=$(find build/documentscanner/android/app/build/outputs/apk -name "*.apk" | head -1)
          APK_NAME="documentscanner-debug-${DATE}-${SHORT_SHA}.apk"
          cp "$APK" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=Debug Build #${{ github.run_number }} ($(date +%Y-%m-%d))" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug/${{ github.run_number }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          files: ${{ steps.meta.outputs.apk_name }}
          body: |
            Automatisch erstellter Debug-Build.

            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            > Diese APK ist mit dem Debug-Keystore signiert und dient nur zum Testen.
            > Sie wird **nicht** im Play Store veröffentlicht.
