name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Yarn 4 ships via Corepack; no separate install needed
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: yarn install --immutable

      # The NativeScript CLI (`ns`) is normally a global install for this project.
      # @akylas/nativescript is the framework fork, not the CLI, so it does not
      # provide an `ns` binary. We install the standard CLI globally here.
      - name: Install NativeScript CLI globally
        run: npm install -g nativescript

      - name: Verify NativeScript CLI
        run: ns --version

      - name: Build debug APK
        run: ns build android --env.adhoc --force

      - name: Prepare release metadata
        id: meta
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA="${GITHUB_SHA::7}"
          APK=$(find build/documentscanner/android/app/build/outputs/apk -name "*.apk" | head -1)
          APK_NAME="documentscanner-debug-${DATE}-${SHORT_SHA}.apk"
          cp "$APK" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=Debug Build #${{ github.run_number }} ($(date +%Y-%m-%d))" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug/${{ github.run_number }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          files: ${{ steps.meta.outputs.apk_name }}
          body: |
            Automatisch erstellter Debug-Build.

            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            > Diese APK ist mit dem Debug-Keystore signiert und dient nur zum Testen.
            > Sie wird **nicht** im Play Store veröffentlicht.
