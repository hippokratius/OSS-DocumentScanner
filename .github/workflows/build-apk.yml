name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Yarn 4 ships via Corepack; no separate install needed
      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            node_modules
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build debug APK
        run: ./node_modules/.bin/ns build android --env.adhoc

      - name: Find built APK
        id: apk
        run: |
          APK=$(find build/documentscanner/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=documentscanner-debug-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug/${{ github.run_number }}
          name: "Debug Build #${{ github.run_number }} ($(date +%Y-%m-%d))"
          prerelease: true
          files: ${{ steps.apk.outputs.name }}
          body: |
            Automatisch erstellter Debug-Build.

            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            > Diese APK ist unsigniert (Debug-Keystore) und dient nur zum Testen.
            > Sie wird **nicht** im Play Store veröffentlicht.
